<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Night Games 💕</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: url('3305431.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(255, 105, 180, 0.3);
            border: 3px solid #ffb3d9;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #ff69b4;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #ff9ec4;
            margin-bottom: 30px;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .game-button {
            background: linear-gradient(135deg, #ff9ec4 0%, #ffb3d9 100%);
            color: white;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
        }
        
        .game-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            background: linear-gradient(135deg, #ff69b4 0%, #ff9ec4 100%);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Date Night Games 💕</h1>
        <p class="subtitle">Pick a game to play together!</p>
        
        <div class="button-container">
            <a href="YOUR_WORDLE_LINK_HERE" class="game-button">
                🔤 Custom Wordle
            </a>
            
            <a href="YOUR_CONNECTIONS_LINK_HERE" class="game-button">
                🧩 Connections
            </a>
            
            <a href="https://jigsawpuzzles.io" class="game-button">
                🖼️ Jigsaw Puzzles
            </a>
            
            <a href="https://www.chess.com/play/online" class="game-button">
                ♟️ Chess
            </a>
            
            <a href="https://skribbl.io" class="game-button">
                🎨 Skribbl
            </a>
        </div>
    </div>
</body>
</html>
